name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # ColimaStatus builds cgo bridges against Foundation and ServiceManagement,
    # so it can only be verified on a macOS runner.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        # format.sh rewrites files, which CI cannot detect. Assert instead.
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "${unformatted}" ]]; then
            echo "These files are not gofmt-clean:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Verify Go module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: ./Build/vet.sh

      - name: Verify localization catalogs
        run: ./Build/localization.sh

      - name: Test
        run: go test -race ./...

      - name: Build app bundle
        # build.sh also asserts that the linked binary's minimum macOS version
        # matches APP_DEPLOYMENT_TARGET.
        run: ./Build/build.sh

      - name: Verify app bundle
        run: |
          dist/ColimaStatus.app/Contents/MacOS/ColimaStatus --version
          plutil -lint dist/ColimaStatus.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 dist/ColimaStatus.app
          xcrun vtool -show-build-version dist/ColimaStatus.app/Contents/MacOS/ColimaStatus
          # A universal bundle must carry both slices. Without the x86_64 one an
          # Intel Mac gets an app that cannot launch, and Homebrew reports
          # nothing about the mismatch.
          archs="$(lipo -archs dist/ColimaStatus.app/Contents/MacOS/ColimaStatus)"
          echo "Architectures: ${archs}"
          for required in arm64 x86_64; do
            if [[ "${archs}" != *"${required}"* ]]; then
              echo "Missing ${required} slice in the build." >&2
              exit 1
            fi
          done

  lint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned on purpose: an unpinned linter turns an upstream release into
          # a red build on unrelated pull requests. Bump this deliberately.
          version: v2.14.0

  # Shell is the release path now: Build/local-release.sh signs, publishes and
  # pushes a cask. This runs on Linux because the macOS runner image does not
  # ship shellcheck, and linting shell does not need macOS.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shellcheck the build scripts
        run: shellcheck -S warning Build/*.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          show-openssf-scorecard: true

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  # A single stable ruleset context. always() is essential: GitHub treats a
  # skipped required job as passing, even when an upstream dependency failed.
  required-checks:
    name: Required checks
    if: always()
    needs: [verify, lint, shellcheck, dependency-review, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq --exit-status --arg event "$EVENT_NAME" '
            all(to_entries[];
              .value.result == "success" or
              (.key == "dependency-review" and
               $event != "pull_request" and .value.result == "skipped"))
          ' <<<"$CHECK_RESULTS"
