name: Release artifacts

# Signing and notarization stay local: Build/release.sh needs the private
# Developer ID identity and a notarytool keychain profile, which deliberately
# never reach GitHub.
#
# This workflow builds the bundle that the local signing step then consumes, so
# the shipped binary comes from the tagged commit built on a clean machine
# rather than from a maintainer's working tree. The archive is attested with
# GitHub build provenance, which binds these exact bytes to this repository,
# this workflow and this commit.
#
# The attestation covers the UNSIGNED archive. Signing, notarizing and stapling
# rewrite the bundle afterwards, so the published release asset has a different
# digest and is not itself attested; Build/local-release.sh records the link
# between the two in the release notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      # Required to mint the Sigstore certificate for the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="v$(cat VERSION)"
          if [[ "${tag}" != "${expected}" ]]; then
            echo "Tag ${tag} does not match VERSION (${expected})." >&2
            exit 1
          fi

      - run: ./Build/vet.sh
      - run: ./Build/localization.sh
      - run: go test -race ./...
      - run: ./Build/build.sh

      - name: Verify app bundle
        run: |
          dist/ColimaStatus.app/Contents/MacOS/ColimaStatus --version
          plutil -lint dist/ColimaStatus.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 dist/ColimaStatus.app
          xcrun vtool -show-build-version dist/ColimaStatus.app/Contents/MacOS/ColimaStatus
          # A universal bundle must carry both slices. Without the x86_64 one an
          # Intel Mac gets an app that cannot launch, and Homebrew reports
          # nothing about the mismatch.
          archs="$(lipo -archs dist/ColimaStatus.app/Contents/MacOS/ColimaStatus)"
          echo "Architectures: ${archs}"
          for required in arm64 x86_64; do
            if [[ "${archs}" != *"${required}"* ]]; then
              echo "Missing ${required} slice in release build." >&2
              exit 1
            fi
          done

      # upload-artifact does not preserve file permissions, which would strip the
      # executable bit from Contents/MacOS/ColimaStatus. codesign would sign that
      # happily and the app would fail to launch. ditto keeps the bundle intact,
      # and the outer zip that upload-artifact adds does not matter.
      - name: Archive the app bundle
        id: archive
        run: |
          mkdir -p dist/ci
          archive="dist/ci/ColimaStatus-${GITHUB_REF_NAME#v}-unsigned.zip"
          COPYFILE_DISABLE=1 ditto \
            -c -k \
            --keepParent \
            --norsrc \
            --noextattr \
            dist/ColimaStatus.app \
            "${archive}"

          digest="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          echo "path=${archive}" >>"${GITHUB_OUTPUT}"
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          {
            echo "### Unsigned build"
            echo
            echo "SHA-256: \`${digest}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Attest the unsigned build
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.archive.outputs.path }}

      - uses: actions/upload-artifact@v7
        with:
          name: ColimaStatus-${{ github.ref_name }}-unsigned
          path: ${{ steps.archive.outputs.path }}
          retention-days: 14
